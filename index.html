
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@sobombr</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #050000;
    color: white;
    font-family: Arial, sans-serif;
    padding: 14px;
    overflow-x: hidden;
}

.header {
    max-width: 620px;
    margin: 8px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 9px;
}

.telegram-icon {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #ff3434, #750000);
    border: 1px solid #ff4444;
    box-shadow: 0 0 12px #ff1717, 0 0 28px #b90000;
    font-size: 21px;
}

.brand-name {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 0 12px #ff2020;
}

.channel {
    font-size: 10px;
    color: #ff7777;
    margin-top: 3px;
    letter-spacing: 1px;
}

.lang {
    display: flex;
    gap: 6px;
}

.lang button {
    background: #100000;
    border: 1px solid #8e1010;
    color: #aaa;
    border-radius: 8px;
    padding: 7px 10px;
    cursor: pointer;
}

.lang button.active {
    color: white;
    border-color: #ff3030;
    box-shadow: 0 0 12px #ff2020;
}

.container {
    width: 100%;
    max-width: 570px;
    margin: 55px auto 0;
    text-align: center;
    position: relative;
    z-index: 2;
}

h1 {
    font-size: clamp(37px, 8vw, 53px);
    font-weight: 900;
    letter-spacing: -2px;
    text-shadow: 0 0 20px #ff2020, 0 0 45px #9b0000;
}

.subtitle {
    color: #a77a7a;
    margin-top: 9px;
    font-size: 14px;
}

.card {
    margin-top: 25px;
    padding: 25px 19px;
    border: 1px solid #9e1515;
    border-radius: 25px;
    background: linear-gradient(145deg, #140000, #050000 65%);
    box-shadow: 0 0 25px #d0000038,
                inset 0 0 25px #75000020;
    animation: appear .5s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.symbol {
    width: 65px;
    height: 65px;
    margin: 0 auto 15px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #200000;
    border: 1px solid #ff2929;
    box-shadow: 0 0 17px #ff2020, inset 0 0 15px #9e0000;
    font-size: 30px;
}

h2 {
    font-size: 24px;
    margin-bottom: 9px;
}

.description {
    color: #a98c8c;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 17px;
}

.main-btn {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 12px auto 0;
    padding: 15px 12px;
    border: 1px solid #d51b1b;
    border-radius: 15px;
    background: linear-gradient(100deg, #190000, #350000, #190000);
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 0 12px #d0000040;
    transition: .2s;
}

.main-btn:hover {
    border-color: #ff5555;
    box-shadow: 0 0 24px #ff2020a0;
    transform: translateY(-2px);
}

.link-box {
    padding: 13px;
    margin: 15px 0;
    border: 1px solid #8d1717;
    border-radius: 12px;
    background: #100000;
    color: #ffaaaa;
    font-size: 12px;
    word-break: break-all;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.hint {
    margin: 12px 0;
    padding: 11px;
    border: 1px solid #741313;
    border-radius: 12px;
    color: #ff9999;
    font-size: 12px;
    line-height: 1.5;
}

.footer {
    color: #613030;
    font-size: 10px;
    letter-spacing: 3px;
    margin-top: 24px;
}

.ghost {
    position: fixed;
    z-index: 1;
    pointer-events: none;
    object-fit: contain;
    filter: drop-shadow(0 0 12px #ff1616)
            drop-shadow(0 0 22px #b00000);
    animation: ghostFlight 10s ease-in-out forwards;
}

@keyframes ghostFlight {
    0% { opacity: 0; transform: translateY(20px) scale(.7); }
    20% { opacity: .7; }
    50% { opacity: .8; transform: translate(35px,-30px) scale(1.1); }
    80% { opacity: .4; }
    100% { opacity: 0; transform: translate(90px,-100px) scale(.7); }
}

@media(max-width: 500px) {
    .container { margin-top: 50px; }
    .card { padding: 21px 14px; }
    .brand-name { font-size: 17px; }
}
</style>
</head>

<body>

<header class="header">
    <div class="brand">
        <div class="telegram-icon">➤</div>
        <div>
            <div class="brand-name">@sobombr</div>
            <div class="channel">ТГ КАНАЛ</div>
        </div>
    </div>

    <div class="lang">
        <button id="ruBtn" class="active" onclick="setLang('ru')">RU</button>
        <button id="enBtn" onclick="setLang('en')">EN</button>
    </div>
</header>

<main class="container">

    <h1 id="heading">Переходник</h1>
    <p class="subtitle" id="subtitle">Выберите нужный раздел</p>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <section class="card page active" id="home">
        <div class="symbol">➤</div>
        <h2 id="cardTitle">Наши сервисы</h2>
        <p class="description" id="description">
            Выберите нужный раздел ниже
        </p>

        <!-- ПЕРВАЯ КНОПКА -->
        <button class="main-btn" onclick="openPage('telegramPage')">
            Telegram-бот 💬
        </button>

        <!-- ОСТАЛЬНЫЕ КНОПКИ -->
        <button class="main-btn" onclick="openPage('snosPage')">
            Бот для сноса ❄️
        </button>

        <button class="main-btn" onclick="openPage('probivPage')">
            Бот для пробива 🔍
        </button>
    </section>

    <!-- TELEGRAM-БОТ -->
    <section class="card page" id="telegramPage">
        <div class="symbol">💬</div>
        <h2>Telegram-бот</h2>
        <p class="description">Ссылка на Telegram-бота:</p>

        <div class="link-box" id="telegramLink"></div>

        <button class="main-btn" onclick="openTelegram()">Открыть</button>
        <button class="main-btn" onclick="copyTelegram()">Скопировать ссылку</button>
        <button class="main-btn" onclick="openPage('home')">Назад</button>
    </section>

    <!-- СНОС -->
    <section class="card page" id="snosPage">
        <div class="symbol">❄️</div>
        <h2>Бот для сноса</h2>
        <p class="description">Раздел находится в разработке.</p>
        <button class="main-btn" onclick="openPage('home')">Назад</button>
    </section>

    <!-- ПРОБИВ -->
    <section class="card page" id="probivPage">
        <div class="symbol">🔍</div>
        <h2>Бот для пробива</h2>
        <p class="description">Раздел находится в разработке.</p>
        <button class="main-btn" onclick="openPage('home')">Назад</button>
    </section>

    <div class="footer">@SOBOMBR • TELEGRAM</div>
</main>

<script>
// ВСТАВЬ СЮДА ССЫЛКУ НА СВОЕГО TELEGRAM-БОТА
const telegramBot = "https://t.me/";

// Переключение страниц
function openPage(id) {
    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

// Открыть Telegram
function openTelegram() {
    if (telegramBot === "https://t.me/") {
        alert("Сначала вставь ссылку на своего бота в код.");
        return;
    }

    window.open(telegramBot, "_blank");
}

// Показать ссылку
document.getElementById("telegramLink").textContent = telegramBot;

// Копирование ссылки
async function copyTelegram() {
    if (telegramBot === "https://t.me/") {
        alert("Сначала вставь ссылку на своего бота в код.");
        return;
    }

    try {
        await navigator.clipboard.writeText(telegramBot);
        alert("Ссылка скопирована!");
    } catch {
        alert("Не удалось скопировать ссылку.");
    }
}

// RU / EN
function setLang(lang) {
    document.getElementById("ruBtn").classList.toggle("active", lang === "ru");
    document.getElementById("enBtn").classList.toggle("active", lang === "en");

    document.getElementById("heading").textContent =
        lang === "ru" ? "Переходник" : "Redirect";

    document.getElementById("subtitle").textContent =
        lang === "ru" ? "Выберите нужный раздел" : "Choose a section";

    document.getElementById("cardTitle").textContent =
        lang === "ru" ? "Наши сервисы" : "Our services";

    document.getElementById("description").textContent =
        lang === "ru" ? "Выберите нужный раздел ниже" : "Choose a section below";
}

// ПРИЗРАКИ
const ghostImage = "Без названия18_20260909224116.png";
let activeGhosts = 0;

function createGhost() {
    if (activeGhosts >= 7) return;

    activeGhosts++;

    const ghost = document.createElement("img");
    ghost.src = ghostImage;
    ghost.className = "ghost";
    ghost.alt = "";

    const size = 35 + Math.random() * 30;
    ghost.style.width = size + "px";
    ghost.style.height = size + "px";
    ghost.style.left = Math.random() * 85 + "vw";
    ghost.style.top = Math.random() * 85 + "vh";
    ghost.style.animationDuration = (8 + Math.random() * 5) + "s";

    document.body.appendChild(ghost);

    ghost.addEventListener("animationend", () => {
        ghost.remove();
        activeGhosts--;
    }, { once: true });

    ghost.onerror = () => {
        ghost.remove();
        activeGhosts--;
    };
}

createGhost();
setInterval(createGhost, 1500);
</script>

</body>
</html>
